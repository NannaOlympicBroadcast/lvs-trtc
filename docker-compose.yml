version: "3.8"

# 局域网全栈视频站 LAN Video Station
# 服务: postgres / redis / minio / api(后端) / web(前端+网关)
# 直播与连麦基于腾讯云 TRTC（需在 .env 配置 TRTC_SDK_APP_ID / TRTC_SECRET_KEY）
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lvs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lvs_password}
      POSTGRES_DB: ${POSTGRES_DB:-lvs}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lvs}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [lvs]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [lvs]

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lvsminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lvsminio_secret}
    ports:
      - "9001:9001" # MinIO 控制台（可选暴露）
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [lvs]

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-lvs}:${POSTGRES_PASSWORD:-lvs_password}@postgres:5432/${POSTGRES_DB:-lvs}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-lvsminio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-lvsminio_secret}
      JWT_SECRET: ${JWT_SECRET:-change_me_jwt_secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      # 站点对外地址，可直接在 .env 中设置 PUBLIC_BASE_URL（如 https://yourdomain.com）；未配置时默认使用 LAN_IP 局域网地址
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://${LAN_IP:-192.168.1.100}:${WEB_HTTP_PORT:-80}}
      # 腾讯云 TRTC（直播/连麦）
      TRTC_SDK_APP_ID: ${TRTC_SDK_APP_ID:-}
      TRTC_SECRET_KEY: ${TRTC_SECRET_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [lvs]

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      # nginx 对外服务总端口（.env 可自定义，如 WEB_HTTP_PORT=8080）
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"   # HTTPS（自签证书，网页推流/连麦需要安全上下文）
    depends_on: [api]
    volumes:
      - /www/wwwroot/video.haiyanfl.cn/.well-known:/usr/share/nginx/html/.well-known:ro
    networks: [lvs]

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  lvs:
    driver: bridge
