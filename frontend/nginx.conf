# 前端 + 反向代理网关（站点统一入口 :80）
server {
    listen 80;
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/lvs.crt;
    ssl_certificate_key /etc/nginx/certs/lvs.key;
    client_max_body_size 4096m;   # 大视频上传

    # Let's Encrypt 域名验证
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /usr/share/nginx/html;
    }

    # SPA 静态资源
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # MCP 服务器（Streamable HTTP + MCP Apps 交互式 UI）：/mcp?key=<API Key>
    location /mcp {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # WebSocket 网关
    location /ws {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 直播/连麦已迁移至腾讯云 TRTC（浏览器直连 TRTC，无需本地媒体反代）

    # 对象存储（视频/缩略图/字幕/录像，来自 MinIO）
    location /storage/ {
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $proxy_host;
        proxy_force_ranges on;
        add_header Access-Control-Allow-Origin * always;
    }
}
